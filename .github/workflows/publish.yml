# Publishes to pub.dev when a version tag is pushed, e.g. `git tag v1.1.1`.
# Requires automated publishing to be enabled on pub.dev with the tag
# pattern `v{{version}}`: https://pub.dev/packages/smart_button/admin
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # tag-pattern on pub.dev: 'v{{version}}'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    permissions:
      id-token: write # Required for authentication using OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Only used to configure the pub.dev OIDC credentials; the Flutter SDK
      # below provides the `dart`/`flutter` commands.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish
        run: flutter pub publish --force
